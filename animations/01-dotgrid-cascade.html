<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 Dot grid → cascade</title>
<style>
  /* Tokens copied verbatim from ../style/tokens.css (Linear motion study).
     Unofficial design study. Not affiliated with Linear. */
  :root{
    --color-bg-marketing:#010102;
    --color-fg-primary:#f7f8f8;
    --color-fg-tertiary:#8a8f98;
    --color-fg-quaternary:#62666d;
    --color-accent:#7170ff;
    --dot-opacity-off:0.3;
    --dot-opacity-on:1;
  }
  html,body{margin:0;height:100%;background:var(--color-bg-marketing);overflow:hidden}
  body{display:grid;place-items:center}
  canvas{width:min(100vw,80vh);height:auto;display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script>
/* ---------- harness: one clock, deterministic, seekable ---------- */
const W = 1080, H = 1350, T = 5000;
function bez(x1,y1,x2,y2){
  const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx;
  const cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const fx=u=>((ax*u+bx)*u+cx)*u, dfx=u=>(3*ax*u+2*bx)*u+cx;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let u=x;
    for(let i=0;i<8;i++){const e=fx(u)-x; if(Math.abs(e)<1e-6)break; const d=dfx(u); if(Math.abs(d)<1e-6)break; u-=e/d;}
    return ((ay*u+by)*u+cy)*u; };
}
const E = { outQuad:bez(.25,.46,.45,.94) };          /* --ease-out-quad */
const cl = (v,a=0,b=1)=>v<a?a:v>b?b:v;
const frac = v => v - Math.floor(v);
const ctx = document.getElementById('c').getContext('2d');

/* ---------- the object: a regular field of dots ---------- */
const STEP = 30, R = 3.2;
const COLS = Math.floor(W/STEP), ROWS = Math.floor(H/STEP);
const OX = (W - (COLS-1)*STEP)/2, OY = (H - (ROWS-1)*STEP)/2;

/* the change: a diagonal wavefront flips them between discrete states.
   Phase is a function of position minus time, so the field is periodic
   in t with period T — the loop is seamless by construction.          */
const WAVE = 980;                 // wavelength in px, ~2 bands on canvas
const DIR = { x: Math.SQRT1_2, y: Math.SQRT1_2 };

/* three hard tiers, no tween — Linear steps its dot grid, never fades it */
const TIER = [
  { upTo:0.014, color:'#7170ff', alpha:1,   r:3.9 },  // crest: the one accent
  { upTo:0.050, color:'#f7f8f8', alpha:0.92,r:3.5 },
  { upTo:0.105, color:'#8a8f98', alpha:0.70,r:3.2 },
];
const OFF = { color:'#62666d', alpha:0.30, r:3.2 };   // --dot-opacity-off

function draw(t){
  ctx.fillStyle = '#010102';
  ctx.fillRect(0,0,W,H);

  /* ambient: a wide, very low radial lift so the centre reads first
     (--grad-radial-glow, white 4% → 0) */
  const g = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,820);
  g.addColorStop(0,'rgba(255,255,255,0.040)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const tn = t/T;
  for(let r=0;r<ROWS;r++){
    const y = OY + r*STEP;
    for(let c=0;c<COLS;c++){
      const x = OX + c*STEP;
      const p = frac((x*DIR.x + y*DIR.y)/WAVE - tn);

      let s = OFF;
      for(const tier of TIER){ if(p < tier.upTo){ s = tier; break; } }

      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(x,y,s.r,0,6.283185307); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  /* the crest carries a faint bloom — brightness, not movement
     (statusFlash logic: a hit of light that decays)                   */
  const crestD = frac(tn) * WAVE;
  const cx = crestD*DIR.x, cy = crestD*DIR.y;
  for(let k=0;k<3;k++){
    const bx = cx - k*WAVE*DIR.x, by = cy - k*WAVE*DIR.y;
    const bg = ctx.createRadialGradient(bx,by,0,bx,by,420);
    bg.addColorStop(0,'rgba(113,112,255,0.10)');
    bg.addColorStop(1,'rgba(113,112,255,0)');
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  }

  /* edge scrim so the field falls off into the frame, never crops hard */
  const v = ctx.createRadialGradient(W/2,H/2,420,W/2,H/2,900);
  v.addColorStop(0,'rgba(1,1,2,0)');
  v.addColorStop(1,'rgba(1,1,2,0.72)');
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}

window.LOOP = T;
window.seek = ms => draw(((ms % T) + T) % T);
if (location.search.includes('capture')) { draw(0); }
else { const run = () => { draw(performance.now() % T); requestAnimationFrame(run); }; requestAnimationFrame(run); }
</script>
</body>
</html>
